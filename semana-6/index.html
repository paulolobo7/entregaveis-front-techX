<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 5 - APIs e Assincronismo</title>
</head>
<body>
  <h1>Buscador de Cep</h1>
  <form id="form-cep">
    <label for="cep">CEP:</label>
    <input type="text" id="cep" placeholder="01001000">
    <button type="submit" id="btn-cep">Buscar</button>
  </form>
  <p id="status-cep"></p>
  <dl id="resultados-cep"></dl>

  <h2>Histórico de CEPs</h2>
  <ul id="historico-cep"></ul>

  <h1>Mini Pokedex</h1>
  <form id="poke">
    <label for="pokemon">Pokemon:</label>
    <input type="text" id="pokemon" placeholder="pikachu">
    <button type="submit" id="btn-poke">Buscar</button>
  </form>
  <p id="status-poke"></p>
  <div id="resultados-poke"></div>
  
  <script src="app.js"></script>
</body>
</html>
